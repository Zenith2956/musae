[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_22"]
nixpkgsArchive = "5148520bfab61f99fd25fb9ff7bfbb50dad3c9db"

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci",
  "npm run build"
]

[phases.start]
cmd = "php artisan storage:link && php artisan serve --host 0.0.0.0 --port $PORT"
