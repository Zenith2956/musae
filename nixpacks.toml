[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "php84Extensions.mysqli", "php84Extensions.openssl", "php84Packages.composer", "nodejs_22"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci",
  "npm run build"
]

[phases.start]
cmd = "php artisan storage:link && php artisan serve --host 0.0.0.0 --port $PORT"
